baseURL: "https://zhixia.pages.dev/" # Canonical origin for all deployments and discovery feeds.
title: 钟灵毓秀
pagination: 
    disableAliases: false
    pagerSize: 5
    path: page
theme: hugo-blog
publishDir: docs

languageCode: zh
DefaultContentLanguage: zh
# Enable English only when translated content is available.
disableLanguages: [en]
enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
hasCJKLanguage: true
# googleAnalytics: UA-123-45

minify:
    disableXML: true
    # minifyOutput: true

languages:
    zh: 
        languageName: "中文"
        languageAltTitle: "Chinese"
        weight: 1
        menu:
            main:
                - name: 归档
                  url: archives
                  weight: 5
                - name: 查找
                  url: search/
                  weight: 8
                - name: 标签
                  url: tags/
                  weight: 7
                - name: 分类
                  url: categories/
                  weight: 6
                - name: 关于
                  url: about/
                  weight: 9
    en:
        languageName: "English"
        weight: 1
        menu:
            main:
                - name: Archive
                  url: archives
                  weight: 5
                - name: Search
                  url: search/
                  weight: 10
                - name: Tags
                  url: tags/
                  weight: 10
                - name: Categories
                  url: categories/
                  weight: 10
outputs:
    home:
        - HTML
        - RSS
        - JSON
        - LLMS

mediaTypes:
    text/markdown:
        suffixes: [md]

outputFormats:
    LLMS:
        mediaType: text/plain
        baseName: llms
        isPlainText: true
        notAlternative: true
    Markdown:
        mediaType: text/markdown
        baseName: index
        isPlainText: true
        rel: alternate

frontmatter:
    lastmod: [lastmod, date]

params:
    social: true
    env: production # to enable google analytics, opengraph, twitter-cards and schema.
    description: "钟灵毓秀是 zhongling 的个人博客，记录 AI Agent、RAG 检索、AI 编程、软件架构与开发实践，也分享读书札记和生活思考。"
    mainSections: [posts]
    homeInfoParams:
        Title: "钟灵毓秀 · 技术与思考"
        Content: "记录 AI Agent、RAG 检索、AI 编程与软件架构的实践，也分享读书与生活中的思考。[浏览全部文章](/posts/) · [关于作者](/about/) · [RSS 订阅](/index.xml)"
    author: zhongling
    # author: ["Me", "You"] # multiple authors

    # disableScrollToTop: true
    defaultTheme: auto
    # disableThemeToggle: true
    # ShowShareButtons: true
    ShowReadingTime: true
    disableSpecial1stPost: true
    # displayFullLangName: true
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    ShowToc: true
    comments: true
    images: ["cover.png"]

    profileMode:
        enabled: false
        title: 钟灵毓秀
        imageUrl: "cover.png"
        imageTitle: my image
        imageWidth: 120
        imageHeight: 120
        buttons:
            - name: 归档
              url: archives/
            - name: 分类
              url: categories/
            - name: 标签
              url: tags/

    # editPost:
    #     URL: "https://github.com/tomorrowthief/tomorrowthief.github.io/"
    #     Text: "Suggest Changes" # edit text
    #     appendFilePath: true # to append file path to Edit link

    # label:
    #     text: "Home"
    #     icon: cover.png
    #     iconHeight: 35

    # analytics:
    #     google:
    #         SiteVerificationTag: "XYZabc"

    assets:
        favicon: "favicon.png"
        favicon16x16: "favicon-16x16.png"
        favicon32x32: "favicon-32x32.png"
        apple_touch_icon: "apple-touch-icon.png"
        safari_pinned_tab: "favicon.png"

    cover:
        hidden: true # hide everywhere but not in structured data
        hiddenInList: true # hide on list pages and home
        hiddenInSingle: true # hide on single page

    # fuseOpts:
    #     isCaseSensitive: false
    #     shouldSort: true
    #     location: 0
    #     distance: 1000
    #     threshold: 0.4
    #     minMatchCharLength: 0
    #     keys: ["title", "permalink", "summary", "content"]

taxonomies:
    category: categories
    tag: tags
    series: series

markup:
    goldmark:
        renderer:
            unsafe: true
#     highlight:
#         # anchorLineNos: true
#         codeFences: true
#         guessSyntax: true
#         lineNos: true
#         # noClasses: false
#         style: monokai

privacy:
    vimeo:
        disabled: false
        simple: true

    x:
        disabled: false
        enableDNT: true
        simple: true

    instagram:
        disabled: false
        simple: true

    youtube:
        disabled: false
        privacyEnhanced: true

services:
    instagram:
        disableInlineCSS: true
    x:
        disableInlineCSS: true
